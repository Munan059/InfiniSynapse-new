<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习计划助手</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 0 auto; padding: 20px; background: #f7f8fa; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 6px; }
  input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  button { background: #2d6cdf; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px; }
  button:disabled { background: #aac1ec; cursor: not-allowed; }
  button.ghost { background: #eee; color: #333; }
  button.login { background: #16a34a; }
  .progress { font-size: 14px; color: #2d6cdf; font-weight: 600; margin: 6px 0; }
  .out { white-space: normal; line-height: 1.7; font-size: 14px; background: #fafbfc; border: 1px solid #eee; border-radius: 8px; padding: 12px; min-height: 60px; word-break: break-word; overflow-wrap: anywhere; }
  .out h1, .out h2, .out h3, .out h4 { margin: 16px 0 8px; line-height: 1.35; }
  .out h1 { font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  .out h2 { font-size: 18px; }
  .out h3 { font-size: 16px; }
  .out p { margin: 8px 0; }
  .out ul, .out ol { margin: 8px 0; padding-left: 22px; }
  .out li { margin: 4px 0; }
  .out code { background: #f0f2e6; padding: 1px 5px; border-radius: 4px; font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  .out pre { background: #0f172a; color: #e2e8f0; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .out pre code { background: none; color: inherit; padding: 0; }
  .out blockquote { border-left: 3px solid #cfd8e3; margin: 8px 0; padding: 4px 12px; color: #555; background: #f7f9fc; }
  .out a { color: #2d6cdf; text-decoration: underline; }
  .out table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  .out th, .out td { border: 1px solid #ddd; padding: 6px 8px; }
  .out strong { font-weight: 700; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > div { flex: 1; }
  .err { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .filebox { border: 1px dashed #cfd8e3; border-radius: 8px; padding: 12px; background: #fbfcfe; }
  .filename { font-size: 13px; color: #2d6cdf; margin-top: 6px; }
  input[type=file] { font-size: 13px; }
  .badge { display:inline-block; font-size:12px; color:#2d6cdf; background:#eaf1fc; border-radius:6px; padding:2px 8px; margin-left:6px;}
  a { color: #2d6cdf; text-decoration: none; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-box { background: #fff; border-radius: 12px; padding: 20px; width: 320px; max-width: 86vw; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .modal-text { font-size: 14px; line-height: 1.6; color: #222; margin-bottom: 18px; }
  .modal-actions { display: flex; gap: 12px; }
  .modal-actions button { flex: 1; margin-top: 0; padding: 10px 0; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
  .btn-cancel { background: #fff; color: #333; border: 1px solid #d0d5dd; }
  .btn-cancel:hover { background: #f2f4f7; }
  .btn-confirm { background: #16a34a; color: #fff; }
  .btn-confirm:hover { background: #15803d; }
</style>
<!-- 本地 Markdown 渲染库（与站点同源，国内访问稳定）：marked 把 # 标题/**加粗** 等转成排版好的 HTML，DOMPurify 过滤危险代码 -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
</head>
<body>
  <h1>学习计划助手</h1>
  <div class="sub">输入你想学的知识，上传教材或教程，AI 帮你列一份清晰可执行的阶段学习计划：每个阶段学什么、重点是什么、建议投入多少时间。</div>

  <!-- 登录卡片：访客用 InfiniSynapse 账号登录（自己的额度） -->
  <div class="card" id="loginCard">
    <label>🔑 登录后使用</label>
    <div id="loginArea">
      <button type="button" class="login" onclick="openLoginConfirm()">使用 InfiniSynapse 登录</button>
    </div>
    <div id="userArea" style="display:none">
      <span class="badge" id="userBadge"></span>
      <a href="/logout" style="font-size:12px;color:#c0392b;margin-left:8px;">退出</a>
    </div>
  </div>

  <div class="card">
    <label>① 你想学习什么知识？（一个领域或主题）</label>
    <input type="text" id="subject" placeholder="例如：机器学习入门 / 短视频运营 / Python 数据分析">

    <label>② 上传学习资料（PDF 教材，或 .txt/.md 教程）</label>
    <div class="filebox">
      <input type="file" id="fileInput" accept=".pdf,.txt,.md,.text">
      <div class="filename" id="fileName"></div>
    </div>
    <div class="hint">也可以不选文件，直接在下面粘贴教程文字。</div>

    <label>或把教程文字直接粘贴到这里</label>
    <textarea id="tutorial" placeholder="把教程、笔记、或资料的文字内容粘进来。越长越准，但别超太长。"></textarea>

    <button id="genBtn" onclick="generate()">③ 生成学习计划</button>
  </div>

  <div class="card">
    <label>AI 输出</label>
    <div class="out" id="output">（结果会显示在这里）</div>
    <div class="err" id="err"></div>
  </div>

<!-- 登录确认弹窗 -->
<div id="loginModal" class="modal-overlay" style="display:none" onclick="if(event.target===this) closeLoginConfirm()">
  <div class="modal-box">
    <div class="modal-text">确认使用 InfiniSynapse 账号登录吗？<br>登录后消耗的是你自己的额度，作者看不到你的 Key。</div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeLoginConfirm()">取消</button>
      <button type="button" class="btn-confirm" onclick="confirmLogin()">确认</button>
    </div>
  </div>
</div>

<script>
  // ===== 登录确认弹窗 =====
  function openLoginConfirm() {
    document.getElementById('loginModal').style.display = 'flex';
  }
  function closeLoginConfirm() {
    document.getElementById('loginModal').style.display = 'none';
  }
  function confirmLogin() {
    window.location.href = '/login';
  }

  // ===== 登录态：加载时问后端当前是否登录 =====
  let loggedIn = false;

  async function refreshLogin() {
    try {
      const resp = await fetch('/api/me');
      const data = await resp.json();
      loggedIn = !!data.loggedIn;
      const loginArea = document.getElementById('loginArea');
      const userArea = document.getElementById('userArea');
      const genBtn = document.getElementById('genBtn');
      if (loggedIn) {
        loginArea.style.display = 'none';
        userArea.style.display = 'block';
        const name = (data.user && (data.user.nickname || data.user.email)) || '已登录';
        document.getElementById('userBadge').textContent = '已登录：' + name;
        genBtn.disabled = false;
      } else {
        loginArea.style.display = 'block';
        userArea.style.display = 'none';
        genBtn.disabled = true;
      }
    } catch {
      // 拿不到登录态就当作未登录
      loggedIn = false;
      document.getElementById('genBtn').disabled = true;
    }
  }

  // 会话用的 taskId 来自后端多轮上下文
  let taskId = null;
  let pdfBase64 = null;     // 选了 PDF 时存 base64
  let tutorialText = '';    // 选了 .txt/.md 时存文字
  let uploadedFile = '';    // 当前已选文件名

  refreshLogin();

  // 把 ArrayBuffer 转成 base64 字符串
  function arrayBufferToBase64(buf) {
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  // 处理文件选择：PDF 转 base64，txt/md 直接读文字
  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    const file = e.target.files[0];
    pdfBase64 = null; tutorialText = '';
    if (!file) { document.getElementById('fileName').textContent = ''; return; }
    const ext = file.name.toLowerCase().split('.').pop();
    try {
      if (ext === 'pdf') {
        const buf = await file.arrayBuffer();
        pdfBase64 = arrayBufferToBase64(buf);
        uploadedFile = file.name;
        document.getElementById('fileName').innerHTML = '已选 PDF：' + file.name;
      } else if (ext === 'txt' || ext === 'md' || ext === 'text') {
        tutorialText = await file.text();
        uploadedFile = file.name;
        document.getElementById('tutorial').value = tutorialText;
        document.getElementById('fileName').innerHTML = '已选教程：' + file.name + '<span class="badge">文字已读入</span>';
      } else {
        document.getElementById('fileName').textContent = '';
        errEl.textContent = '只支持 PDF 或 .txt/.md 文件，请重新选择。';
      }
    } catch (err) {
      errEl.textContent = '读取文件失败：' + err.message;
    }
  });

  async function postChat(text) {
    let resp;
    try {
      resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject: text, pdfBase64, tutorialText, fileName: uploadedFile, taskId })
      });
    } catch (e) {
      throw new Error('网络请求失败（可能服务端没启动或已崩溃）：' + e.message);
    }
    let data;
    try {
      data = await resp.json();
    } catch {
      const txt = await resp.text().catch(() => '');
      throw new Error('服务端返回了非 JSON 内容：' + (txt.slice(0, 300) || '（空响应）'));
    }
    if (data.error) throw new Error(data.error);
    taskId = data.taskId; // 多轮对话靠它续上
    return data.reply;
  }

  // 把 Markdown 文本渲染成安全、排版正确的 HTML（# 标题、**加粗**、- 列表 等都会正确显示，不再裸露 # 号）
  function renderMarkdown(md) {
    if (typeof marked === 'undefined') return '';          // 库没加载成功就返回空，交给下方兜底逻辑显示原文
    const rawHtml = marked.parse(md || '');
    if (typeof DOMPurify !== 'undefined') return DOMPurify.sanitize(rawHtml);
    return rawHtml;
  }

  async function generate() {
    const subject = document.getElementById('subject').value.trim();
    if (!loggedIn) { document.getElementById('err').textContent = '请先点上方「使用 InfiniSynapse 登录」登录后再生成（用自己的额度）。'; return; }
    // 若用户又在文本框里粘贴了，优先取文本框内容
    tutorialText = document.getElementById('tutorial').value.trim() || tutorialText;
    const errEl = document.getElementById('err');
    const outEl = document.getElementById('output');
    const btn = document.getElementById('genBtn');
    errEl.textContent = '';
    if (!subject && !pdfBase64 && !tutorialText) {
      errEl.textContent = '请至少填写想学的知识，或上传 PDF / 教程。';
      return;
    }
    btn.disabled = true; outEl.textContent = '正在读取资料并生成学习计划，请稍候（首次可能要十几秒）…';
    try {
      const reply = await postChat(subject);
      if (!reply) {
        outEl.textContent = '（未返回内容，请到 InfiniSynapse 后台查看任务）';
      } else if (typeof marked !== 'undefined') {
        outEl.innerHTML = renderMarkdown(reply);   // 渲染 Markdown：排版正确，# 号不再裸露
      } else {
        outEl.textContent = reply;                 // 库加载失败时的兜底：至少把原文显示出来
      }
    } catch (e) {
      errEl.textContent = '出错：' + e.message;
      outEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
