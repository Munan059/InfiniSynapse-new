<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新领域教学助手</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 760px; margin: 0 auto; padding: 20px; background: #f7f8fa; color: #222; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 6px; }
  input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea { min-height: 120px; resize: vertical; }
  button { background: #2d6cdf; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 10px; }
  button:disabled { background: #aac1ec; cursor: not-allowed; }
  button.ghost { background: #eee; color: #333; }
  button.login { background: #16a34a; }
  .progress { font-size: 14px; color: #2d6cdf; font-weight: 600; margin: 6px 0; }
  .out { white-space: pre-wrap; line-height: 1.7; font-size: 14px; background: #fafbfc; border: 1px solid #eee; border-radius: 8px; padding: 12px; min-height: 60px; }
  .hint { font-size: 12px; color: #999; margin-top: 4px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > div { flex: 1; }
  .err { color: #c0392b; font-size: 13px; margin-top: 8px; }
  .filebox { border: 1px dashed #cfd8e3; border-radius: 8px; padding: 12px; background: #fbfcfe; }
  .filename { font-size: 13px; color: #2d6cdf; margin-top: 6px; }
  input[type=file] { font-size: 13px; }
  .badge { display:inline-block; font-size:12px; color:#2d6cdf; background:#eaf1fc; border-radius:6px; padding:2px 8px; margin-left:6px;}
  a { color: #2d6cdf; text-decoration: none; }
</style>
</head>
<body>
  <h1>新领域教学助手</h1>
  <div class="sub">输入你想学的知识，上传教材或教程，手把手带你学：拆计划、标重点、出思考题、打卡跟踪进度。</div>

  <!-- 登录卡片：访客用 InfiniSynapse 账号登录（自己的额度） -->
  <div class="card" id="loginCard">
    <label>🔑 登录后使用（用的是你自己的 InfiniSynapse 额度，不花作者钱）</label>
    <div id="loginArea">
      <a href="/login"><button type="button" class="login">使用 InfiniSynapse 登录</button></a>
      <div class="hint">点一下会跳到 InfiniSynapse 官网用你的账号授权登录（没有账号也能在登录页注册，送 500 积分）。登录后消耗的是你自己的额度，作者看不到你的 Key。</div>
    </div>
    <div id="userArea" style="display:none">
      <span class="badge" id="userBadge"></span>
      <a href="/logout" style="font-size:12px;color:#c0392b;margin-left:8px;">退出</a>
    </div>
  </div>

  <div class="card">
    <label>① 你想学习什么知识？（一个领域或主题）</label>
    <input type="text" id="subject" placeholder="例如：机器学习入门 / 短视频运营 / Python 数据分析">

    <label>② 上传学习资料（PDF 教材，或 .txt/.md 教程）</label>
    <div class="filebox">
      <input type="file" id="fileInput" accept=".pdf,.txt,.md,.text">
      <div class="filename" id="fileName"></div>
    </div>
    <div class="hint">也可以不选文件，直接在下面粘贴教程文字。</div>

    <label>或把教程文字直接粘贴到这里</label>
    <textarea id="tutorial" placeholder="把教程、笔记、或资料的文字内容粘进来。越长越准，但别超太长。"></textarea>

    <button id="genBtn" onclick="generate()">③ 生成学习计划</button>
  </div>

  <div class="card">
    <div class="progress" id="progress">已打卡：0 天</div>
    <label>学完第几天后，问下一步</label>
    <div class="row">
      <div><input type="text" id="dayInput" placeholder="例如：1"></div>
      <div style="flex:0 0 auto"><button class="ghost" id="nextBtn" onclick="nextStep()">下一步学什么</button></div>
    </div>
  </div>

  <div class="card">
    <label>AI 输出</label>
    <div class="out" id="output">（结果会显示在这里）</div>
    <div class="err" id="err"></div>
  </div>

<script>
  // ===== 登录态：加载时问后端当前是否登录 =====
  let loggedIn = false;

  async function refreshLogin() {
    try {
      const resp = await fetch('/api/me');
      const data = await resp.json();
      loggedIn = !!data.loggedIn;
      const loginArea = document.getElementById('loginArea');
      const userArea = document.getElementById('userArea');
      const genBtn = document.getElementById('genBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (loggedIn) {
        loginArea.style.display = 'none';
        userArea.style.display = 'block';
        const name = (data.user && (data.user.nickname || data.user.email)) || '已登录';
        document.getElementById('userBadge').textContent = '已登录：' + name;
        genBtn.disabled = false; nextBtn.disabled = false;
      } else {
        loginArea.style.display = 'block';
        userArea.style.display = 'none';
        genBtn.disabled = true; nextBtn.disabled = true;
      }
    } catch {
      // 拿不到登录态就当作未登录
      loggedIn = false;
      document.getElementById('genBtn').disabled = true;
      document.getElementById('nextBtn').disabled = true;
    }
  }

  // 进度存在浏览器本地，刷新不丢
  let taskId = null;
  let pdfBase64 = null;     // 选了 PDF 时存 base64
  let tutorialText = '';    // 选了 .txt/.md 时存文字
  let uploadedFile = '';    // 当前已选文件名

  function loadProgress() {
    const d = parseInt(localStorage.getItem('xy_progress') || '0', 10);
    document.getElementById('progress').textContent = '已打卡：' + d + ' 天';
  }
  loadProgress();
  refreshLogin();

  // 把 ArrayBuffer 转成 base64 字符串
  function arrayBufferToBase64(buf) {
    let binary = '';
    const bytes = new Uint8Array(buf);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  // 处理文件选择：PDF 转 base64，txt/md 直接读文字
  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    const file = e.target.files[0];
    pdfBase64 = null; tutorialText = '';
    if (!file) { document.getElementById('fileName').textContent = ''; return; }
    const ext = file.name.toLowerCase().split('.').pop();
    try {
      if (ext === 'pdf') {
        const buf = await file.arrayBuffer();
        pdfBase64 = arrayBufferToBase64(buf);
        uploadedFile = file.name;
        document.getElementById('fileName').innerHTML = '已选 PDF：' + file.name + '<span class="badge">将抽取文字发给 AI</span>';
      } else if (ext === 'txt' || ext === 'md' || ext === 'text') {
        tutorialText = await file.text();
        uploadedFile = file.name;
        document.getElementById('tutorial').value = tutorialText;
        document.getElementById('fileName').innerHTML = '已选教程：' + file.name + '<span class="badge">文字已读入</span>';
      } else {
        document.getElementById('fileName').textContent = '';
        errEl.textContent = '只支持 PDF 或 .txt/.md 文件，请重新选择。';
      }
    } catch (err) {
      errEl.textContent = '读取文件失败：' + err.message;
    }
  });

  async function postChat(text) {
    let resp;
    try {
      resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject: text, pdfBase64, tutorialText, fileName: uploadedFile, taskId })
      });
    } catch (e) {
      throw new Error('网络请求失败（可能服务端没启动或已崩溃）：' + e.message);
    }
    let data;
    try {
      data = await resp.json();
    } catch {
      const txt = await resp.text().catch(() => '');
      throw new Error('服务端返回了非 JSON 内容：' + (txt.slice(0, 300) || '（空响应）'));
    }
    if (data.error) throw new Error(data.error);
    taskId = data.taskId; // 多轮对话靠它续上
    return data.reply;
  }

  async function generate() {
    const subject = document.getElementById('subject').value.trim();
    if (!loggedIn) { document.getElementById('err').textContent = '请先点上方「使用 InfiniSynapse 登录」登录后再生成（用自己的额度）。'; return; }
    // 若用户又在文本框里粘贴了，优先取文本框内容
    tutorialText = document.getElementById('tutorial').value.trim() || tutorialText;
    const errEl = document.getElementById('err');
    const outEl = document.getElementById('output');
    const btn = document.getElementById('genBtn');
    errEl.textContent = '';
    if (!subject && !pdfBase64 && !tutorialText) {
      errEl.textContent = '请至少填写想学的知识，或上传 PDF / 教程。';
      return;
    }
    btn.disabled = true; outEl.textContent = '正在读取资料并生成学习计划，请稍候（首次可能要十几秒）…';
    try {
      const reply = await postChat(subject);
      outEl.textContent = reply || '（未返回内容，请到 InfiniSynapse 后台查看任务）';
      localStorage.setItem('xy_progress', '0');
      loadProgress();
    } catch (e) {
      errEl.textContent = '出错：' + e.message;
      outEl.textContent = '';
    } finally {
      btn.disabled = false;
    }
  }

  async function nextStep() {
    if (!loggedIn) { document.getElementById('err').textContent = '请先登录。'; return; }
    const day = document.getElementById('dayInput').value.trim();
    const errEl = document.getElementById('err');
    const outEl = document.getElementById('output');
    const btn = document.getElementById('nextBtn');
    errEl.textContent = '';
    if (!day) { errEl.textContent = '请填写学完第几天。'; return; }
    if (!taskId) { errEl.textContent = '请先点「生成学习计划」再打卡。'; return; }
    btn.disabled = true; outEl.textContent = '正在生成下一步建议…';
    try {
      const text = `我已经学完了第 ${day} 天的内容。请告诉我：下一步该学什么、之前的重点有哪些需要复习，并出 1 道综合题。`;
      const reply = await postChat(text);
      outEl.textContent = reply || '（未返回内容）';
      const d = parseInt(day, 10);
      localStorage.setItem('xy_progress', String(d));
      loadProgress();
    } catch (e) {
      errEl.textContent = '出错：' + e.message;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
