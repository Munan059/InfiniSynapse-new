<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习计划助手</title>
<style>
  :root {
    --blue: #2f6bff;
    --blue-hover: #2a5fe6;
    --blue-soft: rgba(47,107,255,.1);
    --ink: #16181d;
    --gray: #6b7280;
    --line: #ececf0;
    --bg: #ffffff;
    --bg-soft: #fafafb;
    --green: #18a957;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
  }

  /* ===== 顶部毛玻璃导航 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 20; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    background: rgba(255,255,255,.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 16px; font-weight: 600; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #2f6bff, #5b8bff); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(47,107,255,.35); }
  .topbar .status { font-size: 13px; color: var(--gray); display: flex; align-items: center; gap: 10px; }
  .topbar .status .badge { font-size: 12px; color: var(--blue); background: var(--blue-soft); border-radius: 980px; padding: 3px 10px; font-weight: 600; }

  /* ===== Hero 标题区 ===== */
  .hero { max-width: 760px; margin: 0 auto; padding: 64px 24px 36px; text-align: center; }
  .hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--blue); text-transform: uppercase; margin-bottom: 16px; }
  .hero h1 { font-size: 42px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: 0 0 16px; }
  .hero h1 .hl { color: var(--blue); }
  .hero p { font-size: 17px; color: var(--gray); margin: 0 auto; max-width: 600px; }
  .hero .tags { margin-top: 22px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--gray); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 980px; padding: 5px 12px; }

  /* ===== 双栏主体（细线分区，非浮卡） ===== */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 8px 28px 24px; }
  .cols { display: flex; align-items: flex-start; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: #fff; }
  .col { flex: 1 1 0; min-width: 0; padding: 32px 36px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .col + .col { border-left: 1px solid var(--line); }

  /* 大号序号分区标题（呼应参考站的 01 / 02） */
  .step { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
  .step .num { font-size: 30px; font-weight: 700; color: #dfe3ea; line-height: 1; letter-spacing: -.02em; }
  .step .title { font-size: 19px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }

  label { display: block; font-size: 13.5px; font-weight: 600; margin: 22px 0 8px; color: var(--ink); }
  label:first-of-type { margin-top: 0; }
  input[type=text], textarea {
    width: 100%; padding: 12px 14px; border: 1px solid #e2e5ea; border-radius: 11px;
    font-size: 14px; font-family: inherit; color: var(--ink); background: #fff;
    transition: border-color .18s, box-shadow .18s;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px var(--blue-soft); }
  textarea { min-height: 120px; resize: vertical; }

  /* 按钮 */
  button { font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: none; border-radius: 11px; padding: 12px 20px; background: var(--blue); color: #fff; transition: background .18s, transform .08s; }
  button:hover { background: var(--blue-hover); }
  button:active { transform: scale(.985); }
  button:disabled { background: #a9c0ff; cursor: not-allowed; transform: none; }
  .btn-primary { width: 100%; margin-top: 24px; padding: 14px 20px; font-size: 15px; }
  button.ghost { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover { background: #f0f0f3; }
  button.login { background: var(--blue); }
  button.login:hover { background: var(--blue-hover); }

  .filebox { border: 1px dashed #d7dbe2; border-radius: 12px; padding: 16px; background: var(--bg-soft); }
  input[type=file] { font-size: 13px; width: 100%; }
  .filename { font-size: 13px; color: var(--blue); margin-top: 8px; }
  .hint { font-size: 12px; color: var(--gray); margin-top: 6px; }
  .badge { display: inline-block; font-size: 12px; color: var(--blue); background: var(--blue-soft); border-radius: 980px; padding: 2px 9px; margin-left: 6px; font-weight: 600; }

  /* 输出区 */
  .out-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .out-actions { display: flex; gap: 8px; }
  .btn-mini { font-size: 13px; padding: 7px 14px; background: var(--blue); color: #fff; border-radius: 980px; font-weight: 600; }
  .btn-mini:hover:not(:disabled) { background: var(--blue-hover); }
  .btn-mini:disabled { background: #c3d2fb; color: #fff; cursor: not-allowed; }

  .out { line-height: 1.65; font-size: 14.5px; color: var(--ink); background: var(--bg-soft); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; flex: 1 1 auto; min-height: 0; align-self: stretch; overflow-y: auto; word-break: break-word; overflow-wrap: anywhere; }
  .out .placeholder { color: var(--gray); font-size: 14px; }
  .out h1, .out h2, .out h3, .out h4 { margin: 22px 0 10px; line-height: 1.35; font-weight: 700; letter-spacing: -.01em; }
  .out h1:first-child, .out h2:first-child, .out h3:first-child { margin-top: 0; }
  .out h1 { font-size: 24px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .out h2 { font-size: 20px; }
  .out h3 { font-size: 17px; color: #2b2e36; }
  .out p { margin: 10px 0; }
  .out ul, .out ol { margin: 10px 0; padding-left: 24px; }
  .out li { margin: 5px 0; }
  .out code { background: #eef1f6; padding: 2px 6px; border-radius: 5px; font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 13px; color: #c0392b; }
  .out pre { background: #16181d; color: #f5f5f7; padding: 14px; border-radius: 12px; overflow-x: auto; }
  .out pre code { background: none; color: inherit; padding: 0; }
  .out blockquote { border-left: 3px solid var(--blue); margin: 12px 0; padding: 6px 14px; color: #4b5160; background: var(--blue-soft); border-radius: 0 8px 8px 0; }
  .out a { color: var(--blue); text-decoration: none; }
  .out a:hover { text-decoration: underline; }
  .out table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .out th, .out td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
  .out th { background: #f0f0f3; font-weight: 600; }
  .out strong { font-weight: 700; }

  /* 输出区细滚动条（苹果风） */
  .out { scrollbar-width: thin; scrollbar-color: #c3c9d4 transparent; }
  .out::-webkit-scrollbar { width: 8px; }
  .out::-webkit-scrollbar-track { background: transparent; }
  .out::-webkit-scrollbar-thumb { background: #c3c9d4; border-radius: 8px; }
  .out::-webkit-scrollbar-thumb:hover { background: #aab2c0; }

  /* 加载动画 */
  .loading { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 440px; min-height: 0; flex: 1 1 auto; align-self: stretch; gap: 18px; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--blue-soft); border-top-color: var(--blue); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 15px; color: var(--gray); }
  .loading-dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } 100% { content: ''; } }

  .err { color: #e02424; font-size: 13px; margin-top: 12px; }

  /* 登录弹窗 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-box { background: #fff; border-radius: 20px; padding: 26px; width: 340px; max-width: 86vw; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal-text { font-size: 15px; line-height: 1.6; color: var(--ink); margin-bottom: 22px; }
  .modal-actions { display: flex; gap: 12px; }
  .modal-actions button { flex: 1; margin-top: 0; padding: 11px 0; border-radius: 11px; font-size: 14px; }
  .btn-cancel { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--line); }
  .btn-cancel:hover { background: #f0f0f3; }
  .btn-confirm { background: var(--blue); color: #fff; }
  .btn-confirm:hover { background: var(--blue-hover); }

  /* 页脚脚注（呼应参考站底部项目署名） */
  .foot { text-align: center; padding: 36px 24px 48px; color: var(--gray); font-size: 12px; letter-spacing: .06em; }
  .foot b { color: var(--ink); font-weight: 600; }

  @media (max-width: 900px) {
    .cols { flex-direction: column; }
    .col + .col { border-left: none; border-top: 1px solid var(--line); }
    .hero h1 { font-size: 32px; }
  }
</style>
</head>
<body>

  <!-- 顶部毛玻璃导航 -->
  <div class="topbar">
    <div class="brand"><span class="logo">学</span>学习计划助手</div>
    <div class="status">
      <span id="topStatus">未登录</span>
      <span class="badge" id="userBadge" style="display:none"></span>
    </div>
  </div>

  <!-- Hero 标题区 -->
  <div class="hero">
    <h1>把想学的，变成<span class="hl">可执行的计划</span>。</h1>
    <p>输入你想学的知识，上传教材或教程，AI 帮你拆成清晰的阶段：每阶段学什么、重点是什么、投入多少时间。</p>
    <div class="tags">
      <span class="pill">AI 驱动</span>
      <span class="pill">Markdown 输出</span>
      <span class="pill">可复制 · 可下载</span>
    </div>
  </div>

  <div class="wrap">
    <div class="cols">

      <!-- 左栏：01 你的输入 -->
      <div class="col" id="loginCard">
        <div class="step"><span class="num">01</span><span class="title">你的输入</span></div>

        <label>登录后使用（任选一种）</label>
        <div id="loginArea">
          <button type="button" class="login" id="ssoBtn" style="width:100%" onclick="openLoginConfirm()">使用 InfiniSynapse 账号登录</button>
          <div class="hint" style="text-align:center;margin:10px 0 2px;">— 或者 —</div>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="password" id="keyInput" placeholder="粘贴你自己的 InfiniSynapse API Key" style="flex:1">
            <button type="button" class="ghost" style="padding:9px 14px;white-space:nowrap;" onclick="saveKey()">保存 Key</button>
          </div>
          <div class="hint" id="keyHint"></div>
        </div>
        <div id="userArea" style="display:none">
          <span class="badge" id="userBadge2"></span>
          <a href="/logout" style="font-size:12px;color:#e02424;margin-left:8px;">退出</a>
        </div>

        <label>① 你想学习什么知识？（一个领域或主题）</label>
        <input type="text" id="subject" placeholder="例如：机器学习入门 / 短视频运营 / Python 数据分析">

        <label>② 上传学习资料（PDF 教材，或 .txt/.md 教程）</label>
        <div class="filebox">
          <input type="file" id="fileInput" accept=".pdf,.txt,.md,.text">
          <div class="filename" id="fileName"></div>
        </div>
        <div class="hint">也可以不选文件，直接在下面粘贴教程文字。</div>

        <label>或把教程文字直接粘贴到这里</label>
        <textarea id="tutorial" placeholder="把教程、笔记、或资料的文字内容粘进来。越长越准，但别超太长。"></textarea>

        <button id="genBtn" class="btn-primary" onclick="generate()">③ 生成学习计划 ↗</button>
        <div class="err" id="err"></div>
      </div>

      <!-- 右栏：02 生成计划 -->
      <div class="col">
        <div class="step"><span class="num">02</span><span class="title">生成计划</span></div>
        <div class="out-header">
          <div class="out-actions">
            <button type="button" class="btn-mini" id="copyBtn" disabled onclick="copyResult()">复制</button>
            <button type="button" class="btn-mini" id="dlBtn" disabled onclick="downloadMd()">下载 .md</button>
            <button type="button" class="btn-mini" id="pdfBtn" disabled onclick="downloadPdf()">下载 PDF</button>
          </div>
        </div>
        <div class="out" id="output">
          <div class="placeholder">（生成后，你的专属学习计划会显示在这里）</div>
        </div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div class="loading-text loading-dots">AI 正在为你生成学习计划</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 页脚署名 -->
  <div class="foot">INFINISYNAPSE · <b>学习计划助手</b> · 由 AI 驱动的个性化学习路径生成</div>

<!-- 登录确认弹窗 -->
<div id="loginModal" class="modal-overlay" style="display:none" onclick="if(event.target===this) closeLoginConfirm()">
  <div class="modal-box">
    <div class="modal-text">确认使用 InfiniSynapse 账号登录吗？<br>登录后消耗的是你自己的额度，作者看不到你的 Key。</div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeLoginConfirm()">取消</button>
      <button type="button" class="btn-confirm" onclick="confirmLogin()">确认</button>
    </div>
  </div>
</div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/html2pdf.bundle.min.js"></script>
<script>
  // ===== 登录确认弹窗 =====
  function openLoginConfirm() {
    document.getElementById('loginModal').style.display = 'flex';
  }
  function closeLoginConfirm() {
    document.getElementById('loginModal').style.display = 'none';
  }
  function confirmLogin() {
    window.location.href = '/login';
  }

  // ===== 登录态：SSO 会话 + 本地 Key 两种模式 =====
  let loggedIn = false;   // SSO 登录态（来自后端 cookie）
  let hasKey = false;     // 本地浏览器里存了访客自己的 Key
  let ssoEnabled = true;  // 后端是否配置了 SSO 凭证

  function updateGenBtn() {
    document.getElementById('genBtn').disabled = !(loggedIn || hasKey);
  }

  async function refreshLogin() {
    try {
      const resp = await fetch('/api/me');
      const data = await resp.json();
      ssoEnabled = !!data.ssoEnabled;
      loggedIn = !!data.loggedIn;
      const ssoBtn = document.getElementById('ssoBtn');
      if (ssoBtn) ssoBtn.style.display = (data.ssoEnabled !== false) ? 'block' : 'none';
      const loginArea = document.getElementById('loginArea');
      const userArea = document.getElementById('userArea');
      const topStatus = document.getElementById('topStatus');
      if (loggedIn) {
        loginArea.style.display = 'none';
        userArea.style.display = 'block';
        const name = (data.user && (data.user.nickname || data.user.email)) || '已登录';
        document.getElementById('userBadge').textContent = '已登录：' + name;
        document.getElementById('userBadge2').textContent = '已登录：' + name;
        topStatus.style.display = 'none';
      } else {
        loginArea.style.display = 'block';
        userArea.style.display = 'none';
        topStatus.style.display = 'inline';
        topStatus.textContent = '未登录';
      }
    } catch {
      loggedIn = false;
      document.getElementById('loginArea').style.display = 'block';
    }
    hasKey = !!localStorage.getItem('infiniKey');
    updateGenBtn();
  }

  function saveKey() {
    const v = document.getElementById('keyInput').value.trim();
    if (!v) { document.getElementById('keyHint').textContent = '请先粘贴 Key 再保存。'; return; }
    localStorage.setItem('infiniKey', v);
    hasKey = true;
    document.getElementById('keyHint').textContent = '已保存（只存在你这个浏览器里，作者看不到）。';
    document.getElementById('keyInput').value = '';
    updateGenBtn();
  }
  function clearKey() {
    localStorage.removeItem('infiniKey');
    hasKey = false;
    document.getElementById('keyHint').textContent = '';
    updateGenBtn();
  }

  // 会话状态变量
  let pdfText = '';        // PDF 在浏览器里抽出的文字
  let tutorialText = '';
  let uploadedFile = '';
  let lastReplyRaw = '';

  refreshLogin();

  // 让右侧输出栏的高度精确等于左侧输入栏，长内容在灰色框内滚动，页面不随之拉长
  function syncOutputHeight() {
    if (window.innerWidth <= 900) return; // 移动端上下堆叠，不强制等高
    const left = document.getElementById('loginCard');
    const right = document.querySelectorAll('.col')[1];
    if (!left || !right) return;
    right.style.height = left.offsetHeight + 'px';
  }
  window.addEventListener('load', syncOutputHeight);
  window.addEventListener('resize', syncOutputHeight);
  window.addEventListener('DOMContentLoaded', syncOutputHeight);

  // 用 pdfjs 在浏览器里抽 PDF 文字（不依赖服务端）
  async function extractPdfText(buf) {
    if (typeof pdfjsLib === 'undefined') throw new Error('PDF 解析组件未加载，请刷新页面，或改用 .txt/.md');
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.js';
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    const file = e.target.files[0];
    pdfText = ''; tutorialText = '';
    if (!file) { document.getElementById('fileName').textContent = ''; return; }
    const ext = file.name.toLowerCase().split('.').pop();
    try {
      if (ext === 'pdf') {
        const buf = await file.arrayBuffer();
        try {
          pdfText = await extractPdfText(buf);
        } catch (pe) {
          errEl.textContent = 'PDF 解析失败：' + pe.message + '（可改用 .txt/.md，或把文字粘到下方文本框）';
          document.getElementById('fileName').textContent = '';
          return;
        }
        uploadedFile = file.name;
        document.getElementById('fileName').innerHTML = '已选 PDF：' + file.name + '<span class="badge">文字已读入</span>';
      } else if (ext === 'txt' || ext === 'md' || ext === 'text') {
        tutorialText = await file.text();
        uploadedFile = file.name;
        document.getElementById('tutorial').value = tutorialText;
        document.getElementById('fileName').innerHTML = '已选教程：' + file.name + '<span class="badge">文字已读入</span>';
      } else {
        document.getElementById('fileName').textContent = '';
        errEl.textContent = '只支持 PDF 或 .txt/.md 文件，请重新选择。';
      }
    } catch (err) {
      errEl.textContent = '读取文件失败：' + err.message;
    }
  });

  // postChat 已改为 generate() 内联的「发任务 + 轮询」流程，见下方 generate()。

  function renderMarkdown(md) {
    if (typeof marked === 'undefined') return '';
    const rawHtml = marked.parse(md || '');
    if (typeof DOMPurify !== 'undefined') return DOMPurify.sanitize(rawHtml);
    return rawHtml;
  }

  async function copyResult() {
    if (!lastReplyRaw) return;
    const btn = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(lastReplyRaw);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = lastReplyRaw; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = old; }, 1500);
  }

  function downloadMd() {
    if (!lastReplyRaw) return;
    const subj = (document.getElementById('subject').value.trim() || '学习计划').replace(/[\\/:*?"<>|]/g, '');
    const blob = new Blob([lastReplyRaw], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = subj + '.md';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function downloadPdf() {
    if (!lastReplyRaw) return;
    const btn = document.getElementById('pdfBtn');
    const old = btn.textContent;
    btn.textContent = '生成中…';
    btn.disabled = true;
    const el = document.getElementById('output');
    const name = (document.getElementById('subject').value.trim() || '学习计划').replace(/[\\/:*?"<>|]/g, '');
    const opt = {
      margin: 12,
      filename: name + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(el).save().then(function () {
      btn.textContent = old;
      btn.disabled = false;
    }).catch(function (e) {
      btn.textContent = old;
      btn.disabled = false;
      alert('PDF 生成失败：' + (e && e.message ? e.message : e));
    });
  }

  async function generate() {
    const subject = document.getElementById('subject').value.trim();
    tutorialText = document.getElementById('tutorial').value.trim() || tutorialText;
    const errEl = document.getElementById('err');
    const outEl = document.getElementById('output');
    const loadingEl = document.getElementById('loading');
    const btn = document.getElementById('genBtn');
    const copyBtn = document.getElementById('copyBtn');
    const dlBtn = document.getElementById('dlBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    errEl.textContent = '';
    if (!loggedIn && !hasKey) {
      errEl.textContent = '请先登录（点上方按钮），或在登录框里粘贴你自己的 InfiniSynapse API Key。';
      return;
    }
    if (!subject && !pdfText && !tutorialText) {
      errEl.textContent = '请至少填写想学的知识，或上传 PDF / 教程。';
      return;
    }
    btn.disabled = true; copyBtn.disabled = true; dlBtn.disabled = true; pdfBtn.disabled = true;
    loadingEl.style.display = 'flex'; outEl.style.display = 'none';
    try {
      // 1) 开新任务，拿到 taskId（很快）
      const apiKey = hasKey ? localStorage.getItem('infiniKey') : undefined;
      const chatResp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, pdfText, tutorialText, fileName: uploadedFile, apiKey })
      });
      const chatData = await chatResp.json().catch(() => ({}));
      if (!chatResp.ok || chatData.error) throw new Error(chatData.error || ('启动失败（HTTP ' + chatResp.status + '）'));
      const taskId = chatData.taskId;
      if (!taskId) throw new Error('未返回任务 ID，请重试。');

      // 2) 轮询直到完成（前端反复问后端，后端每次只查一两秒，避免单次请求超时）
      let reply = '';
      let polls = 0;
      const MAX_POLLS = 45; // 约 45×2.5s ≈ 112s
      while (polls < MAX_POLLS) {
        polls++;
        await new Promise(r => setTimeout(r, 2500));
        const pResp = await fetch('/api/poll?taskId=' + encodeURIComponent(taskId));
        const pData = await pResp.json().catch(() => ({}));
        if (pData.error) throw new Error(pData.error);
        if (pData.reply) reply = pData.reply; // 累积最新最佳结果
        if (pData.done) break;
      }

      lastReplyRaw = reply || '';
      if (!reply) {
        outEl.innerHTML = '<div class="placeholder">（任务结束但未取到内容，请到 InfiniSynapse 后台查看任务）</div>';
      } else if (typeof marked !== 'undefined') {
        outEl.innerHTML = renderMarkdown(reply);
      } else {
        outEl.textContent = reply;
      }
      if (reply) { copyBtn.disabled = false; dlBtn.disabled = false; pdfBtn.disabled = false; }
    } catch (e) {
      errEl.textContent = '出错：' + e.message;
      outEl.innerHTML = '';
    } finally {
      loadingEl.style.display = 'none';
      outEl.style.display = 'block';
      btn.disabled = false;
      syncOutputHeight();
    }
  }
</script>
